name: Django regression tests

on:
  push:
    branches:
      - feature/email-login-phase-1
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-test-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Render startup scripts
        run: bash -n start.sh backend/start.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r ../requirements.txt
      - name: Create temporary ML models for CI tests
        run: python ../.github/scripts/create_ci_test_models.py
      - name: Run Django regression tests
        run: python manage.py test
