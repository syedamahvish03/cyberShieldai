<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Update account email - CyberShield AI</title>
<style>
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#050812,#0f1a3d,#050812);color:#e8f0ff;font-family:Segoe UI,Arial,sans-serif}main{width:100%;max-width:440px;padding:32px;background:rgba(20,28,56,.94);border:1px solid rgba(15,255,255,.25);border-radius:14px}h1{color:#00ffe0;font-size:23px}p{color:#a0b4d4;line-height:1.5}label{display:block;margin:18px 0 8px}input{width:100%;padding:12px;border:1px solid rgba(15,255,255,.25);border-radius:7px;background:#0a0e27;color:white}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:7px;background:linear-gradient(135deg,#00ffe0,#00b3ff);color:#04111f;font-weight:700;cursor:pointer}.errors{color:#ff8090}a{color:#00ffe0}
</style>
</head>
<body><main><h1>Update your account email</h1><p>Link an email address to your existing CyberShield AI account. Your account and scan history will remain unchanged.</p><form method="post">{% csrf_token %}{{ form.email.label_tag }}{{ form.email }}{% if form.email.errors %}<div class="errors">{{ form.email.errors }}</div>{% endif %}<button type="submit">Save email address</button></form><p><a href="{% url 'dashboard' %}">Return to dashboard</a></p></main></body>
</html>
