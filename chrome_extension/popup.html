
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield AI</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <main class="container">
        <header>
            <h2>CyberShield AI</h2>
            <p>AI-powered phishing detection</p>
        </header>

        <section class="settings">
            <h3>API Settings</h3>

            <label for="apiUrl">Backend API URL</label>
            <input
                id="apiUrl"
                type="url"
                value="http://127.0.0.1:8000"
            >

            <label for="apiToken">Extension API Token</label>
            <input
                id="apiToken"
                type="password"
                placeholder="Paste your API token"
                autocomplete="off"
            >

            <button id="saveSettings" class="secondary">
                Save Settings
            </button>
        </section>

        <section class="scanner">
            <h3>Scan Selected Text</h3>

            <label for="contentType">Message type</label>
            <select id="contentType">
                <option value="email">Email</option>
                <option value="sms">SMS</option>
            </select>

            <button id="scanButton" class="primary">
                Scan Selected Text
            </button>

            <p class="hint">
                Select suspicious text on a webpage before scanning.
            </p>
        </section>

        <p id="status" role="status" aria-live="polite"></p>

        <section id="result" class="result" hidden aria-live="polite">
            <h3>Scan Result</h3>
            <div id="resultContent"></div>
        </section>
    </main>

    <script src="popup.js"></script>
</body>
</html>
